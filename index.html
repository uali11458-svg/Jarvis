<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>J.A.R.V.I.S</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:100%; height:100%; overflow:hidden; background:#000; font-family: 'Segoe UI', system-ui, sans-serif; color:#7dd3fc; user-select:none; }
  body::before { content:''; position:fixed; inset:0; background: radial-gradient(circle at 50% 50%, rgba(0,120,255,0.18) 0%, transparent 55%), radial-gradient(circle at 50% 50%, rgba(0,60,150,0.12) 0%, transparent 70%), #000; z-index:0; }
  canvas#globe { position:fixed; inset:0; z-index:1; }
  .header { position:fixed; top:28px; left:0; right:0; text-align:center; z-index:10; pointer-events:none; }
  .header h1 { font-size:32px; letter-spacing:18px; font-weight:200; color:#bfe9ff; text-shadow: 0 0 12px #00d4ff, 0 0 30px #0080ff, 0 0 60px #0055cc; padding-left:18px; }
  .header .sub { margin-top:6px; font-size:11px; letter-spacing:6px; color:#4a90c4; opacity:0.8; }
  .status { position:fixed; top:110px; left:50%; transform:translateX(-50%); z-index:10; display:flex; align-items:center; gap:8px; padding:6px 16px; border:1px solid rgba(0,180,255,0.35); border-radius:999px; background:rgba(0,40,80,0.35); backdrop-filter: blur(8px); font-size:11px; letter-spacing:2px; color:#7dd3fc; }
  .dot { width:7px; height:7px; border-radius:50%; background:#00ff88; box-shadow:0 0 10px #00ff88; animation:pulse 1.6s infinite; }
  .dot.thinking { background:#ffb400; box-shadow:0 0 10px #ffb400; }
  .dot.speaking { background:#00d4ff; box-shadow:0 0 12px #00d4ff; }
  @keyframes pulse { 0%,100% { opacity:1; } 50% { opacity:0.4; } }
  .chat { position:fixed; bottom:130px; left:50%; transform:translateX(-50%); width:min(720px,90vw); max-height:32vh; overflow-y:auto; z-index:9; display:flex; flex-direction:column; gap:10px; padding:0 8px; }
  .msg { padding:10px 16px; border-radius:12px; font-size:14px; line-height:1.5; max-width:78%; word-wrap:break-word; animation: fadeUp 0.35s ease-out; }
  .msg.user { align-self:flex-end; background:rgba(0,120,255,0.18); border:1px solid rgba(0,180,255,0.35); color:#dbeeff; }
  .msg.jarvis { align-self:flex-start; background:rgba(0,60,120,0.20); border:1px solid rgba(0,150,255,0.28); color:#a5dcff; }
  @keyframes fadeUp { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:translateY(0); } }
  .input-bar { position:fixed; bottom:34px; left:50%; transform:translateX(-50%); width:min(720px,90vw); z-index:10; display:flex; align-items:center; gap:10px; padding:8px 8px 8px 20px; border:1px solid rgba(0,180,255,0.4); border-radius:999px; background:rgba(0,25,55,0.65); backdrop-filter: blur(14px); }
  .input-bar input { flex:1; background:transparent; border:none; outline:none; color:#dbeeff; font-size:15px; padding:10px 0; }
  .input-bar input::placeholder { color:#3a6a90; }
  .icon-btn { width:44px; height:44px; border-radius:50%; border:1px solid rgba(0,180,255,0.4); background:rgba(0,80,160,0.25); color:#7dd3fc; display:grid; place-items:center; cursor:pointer; flex-shrink:0; transition: all 0.25s; }
  .icon-btn:hover { background:rgba(0,140,255,0.35); color:#dbeeff; }
  .icon-btn.recording { background:rgba(255,60,60,0.35); border-color:rgba(255,80,80,0.7); color:#ffdede; animation: recPulse 1.2s infinite; }
  @keyframes recPulse { 0%,100% { opacity:1; } 50% { opacity:0.5; } }
  .icon-btn svg { width:20px; height:20px; }
  .settings-toggle { position:fixed; top:24px; right:24px; z-index:20; }
  .settings-panel { position:fixed; top:80px; right:24px; width:340px; max-height:80vh; overflow-y:auto; background:rgba(0,20,45,0.95); border:1px solid rgba(0,180,255,0.4); border-radius:14px; padding:20px; z-index:20; display:none; }
  .settings-panel.open { display:block; }
  .settings-panel h3 { font-size:12px; letter-spacing:3px; color:#7dd3fc; margin-bottom:14px; font-weight:400; }
  .settings-panel label { display:block; font-size:11px; color:#5a9ac9; margin-bottom:6px; margin-top:12px; }
  .settings-panel input, .settings-panel select { width:100%; background:rgba(0,30,60,0.8); border:1px solid rgba(0,150,255,0.3); border-radius:8px; padding:9px 12px; color:#dbeeff; font-size:13px; outline:none; }
  .settings-panel button { width:100%; margin-top:16px; padding:10px; border-radius:8px; border:1px solid rgba(0,180,255,0.5); background:rgba(0,120,255,0.25); color:#bfe9ff; font-size:12px; letter-spacing:2px; cursor:pointer; }
</style>
</head>
<body>

<canvas id="globe"></canvas>
<div class="header"><h1>JARVIS</h1><div class="sub">JUST A RATHER VERY INTELLIGENT SYSTEM</div></div>
<div class="status"><span class="dot" id="statusDot"></span><span id="statusText">SYSTEM ONLINE</span></div>
<div class="chat" id="chat"></div>

<div class="input-bar">
  <input id="userInput" type="text" placeholder="Ask Jarvis anything..." autocomplete="off"/>
  <button class="icon-btn" id="micBtn" title="Mic">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg>
  </button>
  <button class="icon-btn" id="sendBtn" title="Send">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
  </button>
</div>

<button class="icon-btn settings-toggle" id="settingsToggle" title="Settings">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
</button>

<div class="settings-panel" id="settingsPanel">
  <h3>CONFIGURATION</h3>
  <label>OPENROUTER API KEY</label>
  <input type="password" id="apiKey" placeholder="sk-or-v1-..."/>
  <label>MODEL</label>
  <select id="modelSelect">
    <option value="openrouter/free">Auto Free Router ⭐</option>
    <option value="nvidia/nemotron-3-ultra-550b-a55b:free">NVIDIA Nemotron (Free)</option>
    <option value="poolside/laguna-m.1:free">Poolside Laguna (Free)</option>
  </select>
  <label>VOICE LANGUAGE</label>
  <select id="voiceLangSelect">
    <option value="ur">Urdu (اردو)</option>
    <option value="hi">Hindi (हिन्दी)</option>
    <option value="en">English</option>
  </select>
  <button id="saveSettings">SAVE</button>
  <button id="testVoice" style="background:rgba(0,200,150,0.25);">TEST VOICE</button>
</div>

<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>

<script type="module">
import * as THREE from 'three';

// ===== 3D GLOBE =====
const canvas = document.getElementById('globe');
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(55, innerWidth/innerHeight, 0.1, 1000);
camera.position.set(0,0,6);
const renderer = new THREE.WebGLRenderer({ canvas, antialias:true, alpha:true });
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth, innerHeight);

const jarvis = new THREE.Group(); scene.add(jarvis);
const coreSphere = new THREE.Mesh(new THREE.SphereGeometry(1.55,64,64), new THREE.MeshBasicMaterial({color:0x003377, transparent:true, opacity:0.55}));
jarvis.add(coreSphere);
const glowMat = new THREE.MeshBasicMaterial({color:0x00aaff, transparent:true, opacity:0.05, side:THREE.BackSide});
jarvis.add(new THREE.Mesh(new THREE.SphereGeometry(1.72,64,64), glowMat));
const wireframe = new THREE.Mesh(new THREE.IcosahedronGeometry(1.6,3), new THREE.MeshBasicMaterial({color:0x00d4ff, wireframe:true, transparent:true, opacity:0.35}));
jarvis.add(wireframe);

const dotPositions = new Float32Array(900*3);
for (let i=0;i<900;i++){
  const phi = Math.acos(1-2*(i+0.5)/900);
  const theta = Math.PI*(1+Math.sqrt(5))*i;
  const r=1.61;
  dotPositions[i*3]=r*Math.sin(phi)*Math.cos(theta);
  dotPositions[i*3+1]=r*Math.sin(phi)*Math.sin(theta);
  dotPositions[i*3+2]=r*Math.cos(phi);
}
const dotGeo = new THREE.BufferGeometry();
dotGeo.setAttribute('position', new THREE.BufferAttribute(dotPositions,3));
jarvis.add(new THREE.Points(dotGeo, new THREE.PointsMaterial({color:0x7dd3fc, size:0.018, transparent:true, opacity:0.9, blending:THREE.AdditiveBlending})));

const ringGroup = new THREE.Group(); jarvis.add(ringGroup);
function ring(r,t,c,o,rx,ry,rz){ const m=new THREE.Mesh(new THREE.TorusGeometry(r,t,16,220), new THREE.MeshBasicMaterial({color:c,transparent:true,opacity:o,blending:THREE.AdditiveBlending})); m.rotation.set(rx,ry,rz); return m; }
const r1=ring(2.05,0.006,0x00d4ff,0.9,Math.PI/2.4,0,0);
const r2=ring(2.25,0.004,0x0099ff,0.7,Math.PI/1.7,Math.PI/5,0);
const r3=ring(2.5,0.003,0x00aaff,0.55,Math.PI/3.2,0,Math.PI/4);
const r4=ring(2.85,0.002,0x00d4ff,0.35,Math.PI/2.1,Math.PI/3,0);
ringGroup.add(r1,r2,r3,r4);

const sats = [2.05,2.25,2.5,2.85].map((rad,i)=>{
  const s=new THREE.Mesh(new THREE.SphereGeometry(0.035,12,12), new THREE.MeshBasicMaterial({color:[0x00ffff,0x00d4ff,0x66ddff,0x00aaff][i],transparent:true,blending:THREE.AdditiveBlending}));
  s.userData={radius:rad, angle:Math.random()*Math.PI*2, speed:0.4+Math.random()*0.6};
  return s;
});
ringGroup.add(...sats);

const particles = new THREE.Points((()=>{
  const g=new THREE.BufferGeometry(); const p=new Float32Array(350*3);
  for(let i=0;i<350;i++){
    const r=4+Math.random()*5, t=Math.random()*Math.PI*2, ph=Math.acos(2*Math.random()-1);
    p[i*3]=r*Math.sin(ph)*Math.cos(t); p[i*3+1]=r*Math.sin(ph)*Math.sin(t); p[i*3+2]=r*Math.cos(ph);
  }
  g.setAttribute('position', new THREE.BufferAttribute(p,3)); return g;
})(), new THREE.PointsMaterial({color:0x44aaff, size:0.025, transparent:true, opacity:0.55, blending:THREE.AdditiveBlending}));
scene.add(particles);

let mx=0, my=0, tRX=0, tRY=0;
addEventListener('mousemove', e=>{ mx=(e.clientX/innerWidth)*2-1; my=(e.clientY/innerHeight)*2-1; });

const clock = new THREE.Clock();
let jarvisState = 'idle';
function animate(){
  requestAnimationFrame(animate);
  const t = clock.getElapsedTime();
  jarvis.rotation.y += 0.0025;
  jarvis.rotation.x = Math.sin(t*0.25)*0.10;
  wireframe.rotation.y -= 0.004; wireframe.rotation.x += 0.0015;
  r1.rotation.z += 0.0035; r2.rotation.z -= 0.0025; r3.rotation.z += 0.0020; r4.rotation.z -= 0.0015;
  sats.forEach(s=>{ s.userData.angle += s.userData.speed*0.01; const a=s.userData.angle; s.position.set(Math.cos(a)*s.userData.radius, Math.sin(a)*s.userData.radius*0.35, Math.sin(a)*s.userData.radius*0.9); });
  particles.rotation.y += 0.0008; particles.rotation.x += 0.0004;
  tRX += (my*0.3-tRX)*0.04; tRY += (mx*0.4-tRY)*0.04;
  jarvis.rotation.z = -tRY*0.35;
  const pulse = jarvisState==='speaking'?1+Math.sin(t*12)*0.025 : jarvisState==='thinking'?1+Math.sin(t*6)*0.015 : 1+Math.sin(t*1.5)*0.008;
  coreSphere.scale.setScalar(pulse);
  glowMat.opacity = jarvisState==='speaking'?0.10+Math.sin(t*12)*0.04 : 0.05;
  renderer.render(scene, camera);
}
animate();
addEventListener('resize', ()=>{ camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });

// ===== JARVIS =====
const chatEl = document.getElementById('chat');
const inputEl = document.getElementById('userInput');
const micBtn = document.getElementById('micBtn');
const sendBtn = document.getElementById('sendBtn');
const statusDot = document.getElementById('statusDot');
const statusText = document.getElementById('statusText');
const settingsToggle = document.getElementById('settingsToggle');
const settingsPanel = document.getElementById('settingsPanel');
const apiKeyInput = document.getElementById('apiKey');
const modelSelect = document.getElementById('modelSelect');
const voiceLangSelect = document.getElementById('voiceLangSelect');
const saveBtn = document.getElementById('saveSettings');
const testVoiceBtn = document.getElementById('testVoice');

const settings = {
  apiKey: localStorage.getItem('jarvis_apiKey') || '',
  model: localStorage.getItem('jarvis_model') || 'openrouter/free',
  voiceLang: localStorage.getItem('jarvis_voiceLang') || 'ur'
};
apiKeyInput.value = settings.apiKey;
if (settings.model) modelSelect.value = settings.model;
voiceLangSelect.value = settings.voiceLang;

saveBtn.addEventListener('click', ()=>{
  settings.apiKey = apiKeyInput.value.trim();
  settings.model = modelSelect.value;
  settings.voiceLang = voiceLangSelect.value;
  localStorage.setItem('jarvis_apiKey', settings.apiKey);
  localStorage.setItem('jarvis_model', settings.model);
  localStorage.setItem('jarvis_voiceLang', settings.voiceLang);
  settingsPanel.classList.remove('open');
  addMessage('jarvis', 'Saved. Ready.');
});

testVoiceBtn.addEventListener('click', ()=> speak('Assalam o alaikum. Main Jarvis hoon. Aap kaise hain?'));

settingsToggle.addEventListener('click', ()=> settingsPanel.classList.toggle('open'));

const history = [{ role: 'system', content:
  'You are JARVIS, an advanced AI assistant. Calm, intelligent, slightly witty. Keep responses short and natural. ' +
  'IMPORTANT: If user speaks Roman Urdu, reply in Roman Urdu. If Urdu script, reply in Urdu script.'
}];

function addMessage(role, text){
  const el = document.createElement('div');
  el.className = `msg ${role}`;
  el.textContent = text;
  chatEl.appendChild(el);
  chatEl.scrollTop = chatEl.scrollHeight;
}

function setState(s){
  jarvisState = s;
  statusDot.classList.remove('thinking','speaking');
  if (s==='thinking'){ statusDot.classList.add('thinking'); statusText.textContent='PROCESSING'; }
  else if (s==='speaking'){ statusDot.classList.add('speaking'); statusText.textContent='SPEAKING'; }
  else statusText.textContent='SYSTEM ONLINE';
}

// ===== VOICE — Google Translate TTS via corsproxy.io =====
let currentAudio = null;

async function googleTTS(text, lang) {
  // Chunk for 200 char limit
  const chunks = [];
  let rem = text.trim();
  while (rem.length > 0) {
    let c = rem.substring(0, 180);
    if (rem.length > 180) {
      const ls = c.lastIndexOf(' ');
      if (ls > 100) c = c.substring(0, ls);
    }
    chunks.push(c.trim());
    rem = rem.substring(c.length).trim();
  }

  for (const chunk of chunks) {
    if (!chunk) continue;
    const enc = encodeURIComponent(chunk);
    const gUrl = `https://translate.google.com/translate_tts?ie=UTF-8&q=${enc}&tl=${lang}&client=tw-ob`;
    const pUrl = `https://corsproxy.io/?url=${encodeURIComponent(gUrl)}`;

    const res = await fetch(pUrl);
    if (!res.ok) throw new Error(`TTS ${res.status}`);
    const blob = await res.blob();
    if (blob.size < 100) throw new Error('Empty audio');

    const url = URL.createObjectURL(blob);
    await new Promise((resolve, reject) => {
      if (currentAudio) currentAudio.pause();
      currentAudio = new Audio(url);
      currentAudio.onended = () => { URL.revokeObjectURL(url); resolve(); };
      currentAudio.onerror = () => { URL.revokeObjectURL(url); reject(new Error('play fail')); };
      currentAudio.play().catch(reject);
    });
  }
}

async function speak(text) {
  setState('speaking');
  try {
    await googleTTS(text, settings.voiceLang);
    setState('idle');
    return;
  } catch (e) {
    console.warn('Google TTS failed:', e.message);
  }
  // Fallback: browser TTS
  try {
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.rate = 1.0;
    u.onend = () => setState('idle');
    u.onerror = () => setState('idle');
    speechSynthesis.speak(u);
  } catch(e) {
    setState('idle');
  }
}

// ===== OPENROUTER =====
async function askJarvis(userText){
  if (!settings.apiKey){ addMessage('jarvis','Add OpenRouter key in settings.'); return; }
  history.push({ role:'user', content:userText });
  setState('thinking');
  try {
    const res = await fetch('https://openrouter.ai/api/v1/chat/completions', {
      method:'POST',
      headers:{ 'Authorization': `Bearer ${settings.apiKey}`, 'Content-Type':'application/json', 'HTTP-Referer': location.origin, 'X-Title':'JARVIS' },
      body: JSON.stringify({ model: settings.model, messages: history, temperature:0.7, max_tokens:500 })
    });
    if (!res.ok){
      const t = await res.text();
      console.error('OpenRouter:', res.status, t);
      throw new Error(res.status===404?'Model not free. Pick another.':res.status===401?'Key invalid.':res.status===429?'Rate limit.':'Error '+res.status);
    }
    const data = await res.json();
    const reply = data.choices?.[0]?.message?.content?.trim() || '(no reply)';
    history.push({ role:'assistant', content:reply });
    addMessage('jarvis', reply);
    await speak(reply);
  } catch (e){
    console.error(e);
    setState('idle');
    addMessage('jarvis', e.message);
  }
}

function send(){
  const t = inputEl.value.trim(); if (!t) return;
  addMessage('user', t); inputEl.value = '';
  askJarvis(t);
}
sendBtn.addEventListener('click', send);
inputEl.addEventListener('keydown', e=>{ if (e.key==='Enter') send(); });

// ===== MIC =====
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let rec = null, recording = false;
if (SR) {
  rec = new SR();
  rec.continuous = false;
  rec.interimResults = false;
  rec.lang = 'ur-PK';
  rec.onstart = ()=>{ recording=true; micBtn.classList.add('recording'); statusText.textContent='LISTENING'; };
  rec.onresult = (e)=>{ inputEl.value = e.results[0][0].transcript; send(); };
  rec.onend = ()=>{ recording=false; micBtn.classList.remove('recording'); setState('idle'); };
  rec.onerror = ()=>{ recording=false; micBtn.classList.remove('recording'); setState('idle'); };
  micBtn.addEventListener('click', ()=>{
    if (recording) rec.stop();
    else { if (currentAudio) currentAudio.pause(); speechSynthesis.cancel(); try{rec.start();}catch(e){} }
  });
} else {
  micBtn.addEventListener('click', ()=> addMessage('jarvis','Mic not supported. Use Chrome/Edge.'));
}

setTimeout(()=> addMessage('jarvis','Systems online. What can I do for you?'), 600);
</script>
</body>
</html>
