<!DOCTYPE html>
<html lang="ur">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jarvis — AI Assistant</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,500;0,600;1,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #12141a;
    --panel: #191c24;
    --panel-2: #20232d;
    --border: #2a2e39;
    --text: #e9eaee;
    --text-dim: #8b91a3;
    --accent: #4f9dde;
    --accent-dim: #2c4b64;
    --online: #3fbfa0;
  }
  * { box-sizing: border-box; }
  html, body {
    height: 100%;
    margin: 0;
  }
  body {
    font-family: 'Inter', -apple-system, Segoe UI, Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
  }

  /* Header */
  .app-header {
    width: 100%;
    max-width: 720px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 22px 20px 16px;
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .brand-mark {
    width: 38px;
    height: 38px;
    border-radius: 10px;
    background: linear-gradient(135deg, var(--accent), var(--online));
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Fraunces', serif;
    font-weight: 600;
    font-size: 17px;
    color: #0d0f14;
    flex-shrink: 0;
  }
  .brand-text h1 {
    font-family: 'Fraunces', serif;
    font-weight: 600;
    font-style: italic;
    font-size: 22px;
    margin: 0;
    line-height: 1.1;
    color: var(--text);
  }
  .status-line {
    display: flex;
    align-items: center;
    gap: 6px;
    margin-top: 3px;
    font-size: 12.5px;
    color: var(--text-dim);
  }
  .status-dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--online);
    box-shadow: 0 0 0 3px rgba(63, 191, 160, 0.15);
  }

  /* Chat area */
  .chat-wrap {
    width: 100%;
    max-width: 720px;
    flex: 1;
    display: flex;
    flex-direction: column;
    padding: 0 20px;
    min-height: 0;
  }
  .chat-box {
    flex: 1;
    overflow-y: auto;
    padding: 6px 2px 20px;
    display: flex;
    flex-direction: column;
    gap: 14px;
    min-height: 320px;
    max-height: 58vh;
  }
  .chat-box::-webkit-scrollbar { width: 6px; }
  .chat-box::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

  .row { display: flex; gap: 10px; max-width: 88%; }
  .row.user { align-self: flex-end; flex-direction: row-reverse; }
  .row.ai { align-self: flex-start; }

  .avatar {
    width: 28px;
    height: 28px;
    border-radius: 8px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 13px;
    font-weight: 600;
    margin-top: 2px;
  }
  .avatar.ai { background: var(--accent-dim); color: var(--accent); }
  .avatar.user { background: #2a2e39; color: var(--text-dim); }

  .msg {
    padding: 11px 15px;
    border-radius: 14px;
    line-height: 1.55;
    white-space: pre-wrap;
    font-size: 15px;
  }
  .row.ai .msg {
    background: var(--panel);
    border: 1px solid var(--border);
    border-top-left-radius: 4px;
  }
  .row.user .msg {
    background: var(--accent-dim);
    color: #eaf3fb;
    border-top-right-radius: 4px;
  }

  .generated-img {
    max-width: 100%;
    border-radius: 10px;
    margin-top: 8px;
    display: block;
    border: 1px solid var(--border);
  }
  .img-caption {
    font-size: 13px;
    color: var(--text-dim);
    margin-bottom: 2px;
  }

  /* Input bar */
  .input-bar {
    width: 100%;
    max-width: 720px;
    padding: 14px 20px 22px;
  }
  .input-shell {
    display: flex;
    align-items: center;
    gap: 8px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 6px 6px 6px 16px;
  }
  .input-shell:focus-within {
    border-color: var(--accent);
  }
  input {
    flex: 1;
    border: none;
    background: transparent;
    color: var(--text);
    font-size: 15px;
    font-family: inherit;
    padding: 10px 0;
  }
  input:focus { outline: none; }
  input::placeholder { color: var(--text-dim); }

  button.send-btn {
    width: 38px;
    height: 38px;
    border-radius: 10px;
    border: none;
    background: var(--accent);
    color: #0d0f14;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    transition: background 0.15s ease;
  }
  button.send-btn:hover { background: #6bb0e8; }
  button.send-btn:disabled { background: #33394a; cursor: not-allowed; }
  button.send-btn svg { width: 17px; height: 17px; }

  button.attach-btn {
    width: 36px;
    height: 36px;
    border-radius: 10px;
    border: none;
    background: transparent;
    color: var(--text-dim);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    transition: background 0.15s ease, color 0.15s ease;
  }
  button.attach-btn:hover { background: var(--panel-2); color: var(--text); }
  button.attach-btn svg { width: 18px; height: 18px; }

  .attachment-preview {
    display: none;
    align-items: center;
    gap: 10px;
    background: var(--panel-2);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 8px 10px;
    margin-bottom: 8px;
  }
  .attachment-preview.show { display: flex; }
  .attachment-preview img {
    width: 40px;
    height: 40px;
    object-fit: cover;
    border-radius: 6px;
  }
  .attachment-preview .att-name {
    flex: 1;
    font-size: 13px;
    color: var(--text-dim);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .attachment-preview .att-remove {
    background: none;
    border: none;
    color: var(--text-dim);
    cursor: pointer;
    font-size: 18px;
    line-height: 1;
    padding: 2px 6px;
  }
  .attachment-preview .att-remove:hover { color: var(--text); }

  .attached-img-inline {
    max-width: 220px;
    border-radius: 10px;
    margin-bottom: 6px;
    display: block;
    border: 1px solid var(--border);
  }

  .hint {
    text-align: center;
    font-size: 12px;
    color: var(--text-dim);
    margin-top: 10px;
  }
  .hint code {
    background: var(--panel-2);
    padding: 1px 6px;
    border-radius: 5px;
    color: var(--accent);
    font-family: monospace;
  }
</style>
</head>
<body>

  <div class="app-header">
    <div class="brand">
      <div class="brand-mark">J</div>
      <div class="brand-text">
        <h1>Jarvis</h1>
        <div class="status-line"><span class="status-dot"></span>Online</div>
      </div>
    </div>
  </div>

  <div class="chat-wrap">
    <div class="chat-box" id="chatBox">
      <div class="row ai">
        <div class="avatar ai">J</div>
        <div class="msg">Assalam-o-Alaikum! Main Jarvis hoon. Kuch bhi pooch sakte hain.

Image banwani ho to "/image" likh kar shuru karo, jaise: /image ek sher jungle mein baitha hai</div>
      </div>
    </div>
  </div>

  <div class="input-bar">
    <div class="attachment-preview" id="attachPreview">
      <img id="attachThumb" src="" alt="">
      <div class="att-name" id="attachName"></div>
      <button class="att-remove" id="attachRemove" aria-label="Hatao">×</button>
    </div>
    <div class="input-shell">
      <input type="file" id="fileInput" accept="image/*" style="display:none">
      <button class="attach-btn" id="attachBtn" aria-label="Attach">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M21.44 11.05L12.25 20.24C10.01 22.48 6.37 22.48 4.13 20.24C1.89 18 1.89 14.36 4.13 12.12L13.32 2.93C14.81 1.44 17.22 1.44 18.71 2.93C20.2 4.42 20.2 6.83 18.71 8.32L10.36 16.67C9.62 17.41 8.42 17.41 7.68 16.67C6.94 15.93 6.94 14.73 7.68 13.99L15.16 6.51" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
      <input type="text" id="userInput" placeholder="Apna sawaal likhein..." onkeypress="if(event.key==='Enter') sendMessage()">
      <button class="send-btn" id="sendBtn" onclick="sendMessage()" aria-label="Bhejein">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M4 12L20 4L14 20L11 13L4 12Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
        </svg>
      </button>
    </div>
    <div class="hint">Image ke liye <code>/image</code> se message shuru karo, ya 📎 se photo attach karo</div>
  </div>

<script>
  // ============================================
  // Groq API key (free, no phone verification)
  // ============================================
  const API_KEY = "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";

  const MODEL = "openai/gpt-oss-120b";
  const VISION_MODEL = "qwen/qwen3.6-27b";
  const API_URL = "https://api.groq.com/openai/v1/chat/completions";

  const chatBox = document.getElementById('chatBox');
  const userInput = document.getElementById('userInput');
  const sendBtn = document.getElementById('sendBtn');
  const fileInput = document.getElementById('fileInput');
  const attachBtn = document.getElementById('attachBtn');
  const attachPreview = document.getElementById('attachPreview');
  const attachThumb = document.getElementById('attachThumb');
  const attachName = document.getElementById('attachName');
  const attachRemove = document.getElementById('attachRemove');

  let pendingImage = null; // { dataUrl, name }

  attachBtn.addEventListener('click', () => fileInput.click());

  fileInput.addEventListener('change', () => {
    const file = fileInput.files[0];
    if (!file) return;
    if (!file.type.startsWith('image/')) {
      addMessage('⚠️ Abhi sirf images attach ki ja sakti hain.', false);
      fileInput.value = '';
      return;
    }
    const reader = new FileReader();
    reader.onload = (e) => {
      pendingImage = { dataUrl: e.target.result, name: file.name };
      attachThumb.src = pendingImage.dataUrl;
      attachName.innerText = file.name;
      attachPreview.classList.add('show');
    };
    reader.readAsDataURL(file);
  });

  attachRemove.addEventListener('click', () => {
    pendingImage = null;
    fileInput.value = '';
    attachPreview.classList.remove('show');
  });

  // Yahan AI ki identity set hoti hai — naam change karna ho to sirf yahan badlo
  const systemInstruction = 'Tumhara naam Jarvis hai. Tum ek helpful AI assistant ho. Agar koi tumhara naam pooche, to hamesha "Jarvis" bolna. Tum kisi company ke banaye hue nahi ho — tumhe user ne banaya hai.';

  // Conversation history (OpenAI-compatible format Groq bhi use karta hai)
  const conversation = [
    { role: 'system', content: systemInstruction }
  ];

  function addMessage(text, isUser, imageDataUrl) {
    const row = document.createElement('div');
    row.className = 'row ' + (isUser ? 'user' : 'ai');

    const avatar = document.createElement('div');
    avatar.className = 'avatar ' + (isUser ? 'user' : 'ai');
    avatar.innerText = isUser ? 'Y' : 'J';

    const bubble = document.createElement('div');
    bubble.className = 'msg';

    if (imageDataUrl) {
      const img = document.createElement('img');
      img.className = 'attached-img-inline';
      img.src = imageDataUrl;
      bubble.appendChild(img);
    }
    const textNode = document.createElement('div');
    textNode.innerText = text;
    bubble.appendChild(textNode);

    row.appendChild(avatar);
    row.appendChild(bubble);
    chatBox.appendChild(row);
    chatBox.scrollTop = chatBox.scrollHeight;
    return textNode;
  }

  function addImageMessage(prompt) {
    const row = document.createElement('div');
    row.className = 'row ai';

    const avatar = document.createElement('div');
    avatar.className = 'avatar ai';
    avatar.innerText = 'J';

    const bubble = document.createElement('div');
    bubble.className = 'msg';

    const caption = document.createElement('div');
    caption.className = 'img-caption';
    caption.innerText = '🎨 "' + prompt + '"';

    const img = document.createElement('img');
    img.className = 'generated-img';
    img.src = 'https://image.pollinations.ai/prompt/' + encodeURIComponent(prompt) + '?width=512&height=512&nologo=true&seed=' + Math.floor(Math.random() * 100000);
    img.alt = prompt;

    bubble.appendChild(caption);
    bubble.appendChild(img);
    row.appendChild(avatar);
    row.appendChild(bubble);
    chatBox.appendChild(row);
    chatBox.scrollTop = chatBox.scrollHeight;
    return bubble;
  }

  async function sendMessage() {
    const text = userInput.value.trim();
    const image = pendingImage;

    if (!text && !image) return;

    // Image generation command: "/image <prompt>"
    if (!image && text.toLowerCase().startsWith('/image ')) {
      const prompt = text.slice(7).trim();
      addMessage(text, true);
      userInput.value = '';
      if (!prompt) {
        addMessage('Image ke liye kuch description bhi likho, jaise: /image ek sher jungle mein', false);
        return;
      }
      addImageMessage(prompt);
      return;
    }

    // Show user's message (with attached image preview if present)
    addMessage(text || '(image bheji)', true, image ? image.dataUrl : null);

    // Build the message content for the API
    let userContent;
    if (image) {
      userContent = [
        { type: 'text', text: text || 'Is image mein kya hai? Explain karo.' },
        { type: 'image_url', image_url: { url: image.dataUrl } }
      ];
    } else {
      userContent = text;
    }
    conversation.push({ role: 'user', content: userContent });

    // Clear input + attachment
    userInput.value = '';
    pendingImage = null;
    fileInput.value = '';
    attachPreview.classList.remove('show');

    sendBtn.disabled = true;
    const thinkingMsg = addMessage('Soch raha hoon...', false);

    try {
      const res = await fetch(API_URL, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': `Bearer ${API_KEY}`
        },
        body: JSON.stringify({
          model: image ? VISION_MODEL : MODEL,
          messages: conversation
        })
      });

      const data = await res.json();

      if (data.error) {
        throw new Error(data.error.message || 'API error');
      }

      const reply = data?.choices?.[0]?.message?.content || 'Koi response nahi mila.';
      thinkingMsg.innerText = reply;
      conversation.push({ role: 'assistant', content: reply });
    } catch (err) {
      console.error(err);
      thinkingMsg.innerText = 'Error aaya: ' + (err.message || 'kuch ghalat ho gaya, dobara try karein.');
    } finally {
      sendBtn.disabled = false;
      userInput.focus();
    }
  }
</script>

</body>
</html>
