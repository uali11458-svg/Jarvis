<!DOCTYPE html>
<html lang="ur">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jarvis — AI Assistant</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,500;0,600;1,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #12141a;
    --panel: #191c24;
    --panel-2: #20232d;
    --border: #2a2e39;
    --text: #e9eaee;
    --text-dim: #8b91a3;
    --accent: #4f9dde;
    --accent-dim: #2c4b64;
    --online: #3fbfa0;
    --danger: #e07a7a;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: 'Inter', -apple-system, Segoe UI, Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
  }

  /* Header */
  .app-header {
    width: 100%;
    max-width: 720px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 22px 20px 16px;
  }
  .brand { display: flex; align-items: center; gap: 12px; }
  .brand-mark {
    width: 38px; height: 38px;
    border-radius: 10px;
    background: linear-gradient(135deg, var(--accent), var(--online));
    display: flex; align-items: center; justify-content: center;
    font-family: 'Fraunces', serif;
    font-weight: 600; font-size: 17px;
    color: #0d0f14;
    flex-shrink: 0;
  }
  .brand-text h1 {
    font-family: 'Fraunces', serif;
    font-weight: 600; font-style: italic;
    font-size: 22px; margin: 0; line-height: 1.1;
    color: var(--text);
  }
  .status-line {
    display: flex; align-items: center; gap: 6px;
    margin-top: 3px;
    font-size: 12.5px; color: var(--text-dim);
  }
  .status-dot {
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--online);
    box-shadow: 0 0 0 3px rgba(63, 191, 160, 0.15);
  }
  .clear-btn {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text-dim);
    padding: 6px 12px;
    border-radius: 8px;
    font-size: 12.5px;
    font-family: inherit;
    cursor: pointer;
    transition: color 0.15s ease, border-color 0.15s ease;
  }
  .clear-btn:hover { color: var(--text); border-color: var(--accent); }

  /* Chat area */
  .chat-wrap {
    width: 100%;
    max-width: 720px;
    flex: 1;
    display: flex;
    flex-direction: column;
    padding: 0 20px;
    min-height: 0;
  }
  .chat-box {
    flex: 1;
    overflow-y: auto;
    padding: 6px 2px 20px;
    display: flex;
    flex-direction: column;
    gap: 14px;
    min-height: 320px;
    max-height: 58vh;
  }
  .chat-box::-webkit-scrollbar { width: 6px; }
  .chat-box::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

  .row { display: flex; gap: 10px; max-width: 88%; }
  .row.user { align-self: flex-end; flex-direction: row-reverse; }
  .row.ai { align-self: flex-start; }

  .avatar {
    width: 28px; height: 28px;
    border-radius: 8px;
    flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 13px; font-weight: 600;
    margin-top: 2px;
  }
  .avatar.ai { background: var(--accent-dim); color: var(--accent); }
  .avatar.user { background: #2a2e39; color: var(--text-dim); }

  .msg {
    padding: 11px 15px;
    border-radius: 14px;
    line-height: 1.55;
    white-space: pre-wrap;
    font-size: 15px;
    word-wrap: break-word;
    overflow-wrap: anywhere;
  }
  .row.ai .msg {
    background: var(--panel);
    border: 1px solid var(--border);
    border-top-left-radius: 4px;
  }
  .row.user .msg {
    background: var(--accent-dim);
    color: #eaf3fb;
    border-top-right-radius: 4px;
  }

  .generated-img {
    max-width: 100%;
    border-radius: 10px;
    margin-top: 8px;
    display: block;
    border: 1px solid var(--border);
  }
  .img-caption {
    font-size: 13px;
    color: var(--text-dim);
    margin-bottom: 2px;
  }
  .img-error {
    color: var(--danger);
    font-size: 13px;
    margin-top: 6px;
  }

  .copy-btn {
    display: block;
    margin-top: 8px;
    background: transparent;
    border: none;
    color: var(--text-dim);
    font-size: 12px;
    cursor: pointer;
    padding: 0;
    font-family: inherit;
    transition: color 0.15s ease;
  }
  .copy-btn:hover { color: var(--accent); }

  /* Input bar */
  .input-bar {
    width: 100%;
    max-width: 720px;
    padding: 14px 20px 22px;
  }
  .input-shell {
    display: flex;
    align-items: center;
    gap: 8px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 6px 6px 6px 16px;
    transition: border-color 0.15s ease;
  }
  .input-shell:focus-within { border-color: var(--accent); }
  input {
    flex: 1;
    border: none;
    background: transparent;
    color: var(--text);
    font-size: 15px;
    font-family: inherit;
    padding: 10px 0;
  }
  input:focus { outline: none; }
  input::placeholder { color: var(--text-dim); }
  input:disabled { opacity: 0.5; }

  button.send-btn {
    width: 38px; height: 38px;
    border-radius: 10px; border: none;
    background: var(--accent);
    color: #0d0f14;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
    transition: background 0.15s ease;
  }
  button.send-btn:hover:not(:disabled) { background: #6bb0e8; }
  button.send-btn:disabled { background: #33394a; cursor: not-allowed; }
  button.send-btn svg { width: 17px; height: 17px; }

  button.attach-btn {
    width: 36px; height: 36px;
    border-radius: 10px; border: none;
    background: transparent;
    color: var(--text-dim);
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
    transition: background 0.15s ease, color 0.15s ease;
  }
  button.attach-btn:hover { background: var(--panel-2); color: var(--text); }
  button.attach-btn svg { width: 18px; height: 18px; }

  .attachment-preview {
    display: none;
    align-items: center;
    gap: 10px;
    background: var(--panel-2);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 8px 10px;
    margin-bottom: 8px;
  }
  .attachment-preview.show { display: flex; }
  .attachment-preview img {
    width: 40px; height: 40px;
    object-fit: cover;
    border-radius: 6px;
  }
  .attachment-preview .att-name {
    flex: 1;
    font-size: 13px;
    color: var(--text-dim);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .attachment-preview .att-remove {
    background: none; border: none;
    color: var(--text-dim);
    cursor: pointer;
    font-size: 18px; line-height: 1;
    padding: 2px 6px;
  }
  .attachment-preview .att-remove:hover { color: var(--text); }

  .attached-img-inline {
    max-width: 220px;
    border-radius: 10px;
    margin-bottom: 6px;
    display: block;
    border: 1px solid var(--border);
  }

  .hint {
    text-align: center;
    font-size: 12px;
    color: var(--text-dim);
    margin-top: 10px;
  }
  .hint code {
    background: var(--panel-2);
    padding: 1px 6px;
    border-radius: 5px;
    color: var(--accent);
    font-family: monospace;
  }

  /* typing cursor */
  .streaming::after {
    content: '▍';
    color: var(--accent);
    animation: blink 1s steps(2) infinite;
    margin-left: 1px;
  }
  @keyframes blink { 50% { opacity: 0; } }
</style>
</head>
<body>

  <div class="app-header">
    <div class="brand">
      <div class="brand-mark">J</div>
      <div class="brand-text">
        <h1>Jarvis</h1>
        <div class="status-line"><span class="status-dot"></span>Online</div>
      </div>
    </div>
    <button class="clear-btn" id="clearBtn">Chat Clear</button>
  </div>

  <div class="chat-wrap">
    <div class="chat-box" id="chatBox">
      <div class="row ai">
        <div class="avatar ai">J</div>
        <div class="msg">Assalam-o-Alaikum! Main Jarvis hoon. Kuch bhi pooch sakte hain.

Image banwani ho to "/image" likh kar shuru karo, jaise: /image ek sher jungle mein baitha hai</div>
      </div>
    </div>
  </div>

  <div class="input-bar">
    <div class="attachment-preview" id="attachPreview">
      <img id="attachThumb" src="" alt="">
      <div class="att-name" id="attachName"></div>
      <button class="att-remove" id="attachRemove" aria-label="Hatao">×</button>
    </div>
    <div class="input-shell">
      <input type="file" id="fileInput" accept="image/*" style="display:none">
      <button class="attach-btn" id="attachBtn" aria-label="Attach">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M21.44 11.05L12.25 20.24C10.01 22.48 6.37 22.48 4.13 20.24C1.89 18 1.89 14.36 4.13 12.12L13.32 2.93C14.81 1.44 17.22 1.44 18.71 2.93C20.2 4.42 20.2 6.83 18.71 8.32L10.36 16.67C9.62 17.41 8.42 17.41 7.68 16.67C6.94 15.93 6.94 14.73 7.68 13.99L15.16 6.51" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
      <input type="text" id="userInput" placeholder="Apna sawaal likhein..." autocomplete="off">
      <button class="send-btn" id="sendBtn" onclick="sendMessage()" aria-label="Bhejein">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M4 12L20 4L14 20L11 13L4 12Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
        </svg>
      </button>
    </div>
    <div class="hint">Image ke liye <code>/image</code> se message shuru karo, ya 📎 se photo attach karo</div>
  </div>

<script>
/* =========================================================
   ⚠️⚠️⚠️  ZAROORI WARNING  ⚠️⚠️⚠️
   Ye API key BROWSER mein expose hai — koi bhi View Source
   karke ise chura sakta hai. Production ke liye backend
   proxy zaroor lagayein (neeche comments mein code diya
   hai). Filhaal key ko rotate karke apni nayi key daalein.
   ========================================================= */
const GROQ_KEY = "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";

const TEXT_MODEL   = "openai/gpt-oss-120b";
const VISION_MODEL = "meta-llama/llama-4-scout-17b-16e-instruct";
const API_URL      = "https://api.groq.com/openai/v1/chat/completions";
const HISTORY_KEY  = "jarvis_history_v1";
const MAX_HISTORY  = 20;

/* ---------------- DOM refs ---------------- */
const chatBox       = document.getElementById('chatBox');
const userInput     = document.getElementById('userInput');
const sendBtn       = document.getElementById('sendBtn');
const fileInput     = document.getElementById('fileInput');
const attachBtn     = document.getElementById('attachBtn');
const attachPreview = document.getElementById('attachPreview');
const attachThumb   = document.getElementById('attachThumb');
const attachName    = document.getElementById('attachName');
const attachRemove  = document.getElementById('attachRemove');
const clearBtn      = document.getElementById('clearBtn');

/* ---------------- State ---------------- */
let pendingImage = null;      // { dataUrl, name }
let isSending    = false;     // concurrent request lock

const systemInstruction = 'Tumhara naam Jarvis hai. Tum ek helpful AI assistant ho. Agar koi tumhara naam pooche, to hamesha "Jarvis" bolna. Tum kisi company ke banaye hue nahi ho — tumhe user ne banaya hai. Hamesha seedha, saaf jawab do — apna internal soch-vichar (thinking/reasoning process) kabhi mat dikhana, sirf final jawab do. Natural tarike se baat karo jaise ek insaan karta hai — normal conversation mein har cheez ko numbered list, bullet points, ya bold text mein mat todo, seedhe paragraph mein baat karo. Sirf tab list use karo jab user steps ya multiple items specifically maange. Hamesha sirf Roman Urdu/Hindi aur English mein jawab do — kisi aur language (Chinese, Arabic script, etc) ka koi lafz kabhi mat likhna.';

let conversation = [{ role: 'system', content: systemInstruction }];

/* ---------------- Attach handling ---------------- */
attachBtn.addEventListener('click', () => fileInput.click());

fileInput.addEventListener('change', () => {
  const file = fileInput.files[0];
  if (!file) return;
  if (!file.type.startsWith('image/')) {
    addPlainMessage('⚠️ Abhi sirf images attach ki ja sakti hain.', false);
    fileInput.value = '';
    return;
  }
  if (file.size > 5 * 1024 * 1024) {
    addPlainMessage('⚠️ Image 5MB se choti honi chahiye.', false);
    fileInput.value = '';
    return;
  }
  const reader = new FileReader();
  reader.onload = (e) => {
    pendingImage = { dataUrl: e.target.result, name: file.name };
    attachThumb.src = pendingImage.dataUrl;
    attachName.innerText = file.name;
    attachPreview.classList.add('show');
  };
  reader.readAsDataURL(file);
});

attachRemove.addEventListener('click', () => {
  pendingImage = null;
  fileInput.value = '';
  attachPreview.classList.remove('show');
});

/* ---------------- Enter key (Shift+Enter allows newline later) ---------------- */
userInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
});

/* ---------------- Clear chat ---------------- */
clearBtn.addEventListener('click', () => {
  if (!confirm('Poori chat clear karni hai?')) return;
  chatBox.innerHTML = '';
  conversation = [{ role: 'system', content: systemInstruction }];
  try { localStorage.removeItem(HISTORY_KEY); } catch(e) {}
  addPlainMessage('Chat clear ho gayi. Naya sawaal poochein.', false);
});

/* ---------------- UI helpers ---------------- */
function addPlainMessage(text, isUser, imageDataUrl) {
  const row = document.createElement('div');
  row.className = 'row ' + (isUser ? 'user' : 'ai');
  const avatar = document.createElement('div');
  avatar.className = 'avatar ' + (isUser ? 'user' : 'ai');
  avatar.innerText = isUser ? 'Y' : 'J';
  const bubble = document.createElement('div');
  bubble.className = 'msg';

  if (imageDataUrl) {
    const img = document.createElement('img');
    img.className = 'attached-img-inline';
    img.src = imageDataUrl;
    bubble.appendChild(img);
  }
  const textNode = document.createElement('div');
  textNode.innerText = text;
  bubble.appendChild(textNode);

  row.appendChild(avatar);
  row.appendChild(bubble);
  chatBox.appendChild(row);
  chatBox.scrollTop = chatBox.scrollHeight;
  return { row, bubble, textNode };
}

function addStreamingMessage() {
  const row = document.createElement('div');
  row.className = 'row ai';
  const avatar = document.createElement('div');
  avatar.className = 'avatar ai';
  avatar.innerText = 'J';
  const bubble = document.createElement('div');
  bubble.className = 'msg streaming';
  const textNode = document.createElement('div');
  bubble.appendChild(textNode);
  row.appendChild(avatar);
  row.appendChild(bubble);
  chatBox.appendChild(row);
  chatBox.scrollTop = chatBox.scrollHeight;
  return { row, bubble, textNode };
}

function addCopyButton(bubble, text) {
  const btn = document.createElement('button');
  btn.className = 'copy-btn';
  btn.innerText = 'Copy';
  btn.onclick = () => {
    navigator.clipboard.writeText(text).then(() => {
      btn.innerText = 'Copied!';
      setTimeout(() => btn.innerText = 'Copy', 1500);
    }).catch(() => {});
  };
  bubble.appendChild(btn);
}

function addImageMessage(prompt) {
  const row = document.createElement('div');
  row.className = 'row ai';
  const avatar = document.createElement('div');
  avatar.className = 'avatar ai';
  avatar.innerText = 'J';
  const bubble = document.createElement('div');
  bubble.className = 'msg';

  const caption = document.createElement('div');
  caption.className = 'img-caption';
  caption.innerText = '🎨 "' + prompt + '"';

  const img = document.createElement('img');
  img.className = 'generated-img';
  const url = 'https://image.pollinations.ai/prompt/' + encodeURIComponent(prompt)
            + '?width=512&height=512&nologo=true&seed=' + Math.floor(Math.random() * 100000);
  img.src = url;
  img.alt = prompt;

  img.onerror = () => {
    img.style.display = 'none';
    const err = document.createElement('div');
    err.className = 'img-error';
    err.innerText = '⚠️ Image load nahi ho saki. Internet ya service check karein.';
    bubble.appendChild(err);
  };

  bubble.appendChild(caption);
  bubble.appendChild(img);
  row.appendChild(avatar);
  row.appendChild(bubble);
  chatBox.appendChild(row);
  chatBox.scrollTop = chatBox.scrollHeight;
}

function cleanMarkdown(text) {
  return text
    .replace(/\*\*(.*?)\*\*/g, '$1')
    .replace(/\*(.*?)\*/g, '$1')
    .replace(/^#{1,6}\s+/gm, '')
    .replace(/^[-•]\s+/gm, '• ')
    .trim();
}

/* ---------------- History helpers ---------------- */
function trimHistory() {
  const system = conversation[0];
  const rest = conversation.slice(1);
  if (rest.length > MAX_HISTORY) {
    conversation = [system, ...rest.slice(-MAX_HISTORY)];
  }
}

function saveHistory() {
  try {
    // save only from index 1 (skip system)
    localStorage.setItem(HISTORY_KEY, JSON.stringify(conversation.slice(1)));
  } catch (e) {}
}

function loadHistory() {
  try {
    const saved = JSON.parse(localStorage.getItem(HISTORY_KEY) || '[]');
    if (!Array.isArray(saved) || !saved.length) return;

    for (const m of saved) {
      if (m.role === 'user') {
        const txt = typeof m.content === 'string' ? m.content : '(message)';
        addPlainMessage(txt, true);
        conversation.push({ role: 'user', content: txt });
      } else if (m.role === 'assistant') {
        const { bubble, textNode } = addStreamingMessage();
        bubble.classList.remove('streaming');
        textNode.innerText = m.content;
        addCopyButton(bubble, m.content);
        conversation.push({ role: 'assistant', content: m.content });
      }
    }
    chatBox.scrollTop = chatBox.scrollHeight;
  } catch (e) {}
}

/* ---------------- Main send ---------------- */
async function sendMessage() {
  if (isSending) return;

  const text  = userInput.value.trim();
  const image = pendingImage;
  if (!text && !image) return;

  /* ----- /image command ----- */
  if (!image && text.toLowerCase().startsWith('/image ')) {
    const prompt = text.slice(7).trim();
    addPlainMessage(text, true);
    userInput.value = '';
    if (!prompt) {
      addPlainMessage('Image ke liye kuch description bhi likho, jaise: /image ek sher jungle mein', false);
      return;
    }
    addImageMessage(prompt);
    return;
  }

  /* ----- build API content ----- */
  let userContentForApi;
  if (image) {
    userContentForApi = [
      { type: 'text', text: text || 'Is image mein kya hai? Explain karo.' },
      { type: 'image_url', image_url: { url: image.dataUrl } }
    ];
  } else {
    userContentForApi = text;
  }

  // UI: show user message
  addPlainMessage(text || '(image bheji)', true, image ? image.dataUrl : null);

  // Clear input UI immediately
  userInput.value = '';
  pendingImage = null;
  fileInput.value = '';
  attachPreview.classList.remove('show');

  // Lock UI
  isSending = true;
  sendBtn.disabled = true;

  const { bubble, textNode } = addStreamingMessage();

  // Build messages for API (do NOT mutate conversation yet)
  const apiMessages = [...conversation, { role: 'user', content: userContentForApi }];

  try {
    const body = {
      model: image ? VISION_MODEL : TEXT_MODEL,
      messages: apiMessages,
      max_completion_tokens: image ? 700 : 1024,
      stream: true
    };
    // reasoning_effort sirf gpt-oss models ke liye
    if (!image) body.reasoning_effort = "low";

    const res = await fetch(API_URL, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': `Bearer ${GROQ_KEY}`
      },
      body: JSON.stringify(body)
    });

    if (!res.ok) {
      let errMsg = `HTTP ${res.status}`;
      try {
        const j = await res.json();
        errMsg = j?.error?.message || errMsg;
      } catch (e) {}
      throw new Error(errMsg);
    }

    const reader  = res.body.getReader();
    const decoder = new TextDecoder();
    let buffer   = '';
    let fullText = '';

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;

      buffer += decoder.decode(value, { stream: true });
      const lines = buffer.split('\n');
      buffer = lines.pop() || '';

      for (const rawLine of lines) {
        const line = rawLine.trim();
        if (!line.startsWith('data:')) continue;
        const payload = line.slice(5).trim();
        if (payload === '[DONE]') continue;
        try {
          const json = JSON.parse(payload);
          const delta = json?.choices?.[0]?.delta?.content;
          if (delta) {
            fullText += delta;
            textNode.innerText = cleanMarkdown(fullText);
            chatBox.scrollTop = chatBox.scrollHeight;
          }
        } catch (e) { /* ignore malformed chunk */ }
      }
    }

    if (!fullText.trim()) fullText = 'Koi response nahi mila.';

    const clean = cleanMarkdown(fullText);
    textNode.innerText = clean;
    bubble.classList.remove('streaming');
    addCopyButton(bubble, clean);

    // Now safely push to conversation history
    const historyUserContent = image
      ? (text ? `${text} [user ne image attach ki thi]` : '[user ne image attach ki thi]')
      : text;
    conversation.push({ role: 'user', content: historyUserContent });
    conversation.push({ role: 'assistant', content: clean });

    trimHistory();
    saveHistory();

  } catch (err) {
    console.error(err);
    bubble.classList.remove('streaming');
    textNode.innerText = 'Error: ' + (err.message || 'kuch ghalat ho gaya, dobara try karein.');
  } finally {
    isSending = false;
    sendBtn.disabled = false;
    userInput.focus();
  }
}

/* ---------------- Init ---------------- */
loadHistory();
</script>

<!--

============================================================
  Ye index.html Vercel par deploy karne ke baad, ek file
  banayein:  /api/chat.js  (project root ke andar "api" folder)

  ---------- api/chat.js ----------
  export default async function handler(req, res) {
    if (req.method !== 'POST') return res.status(405).end();

    const r = await fetch('https://api.groq.com/openai/v1/chat/completions', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': `Bearer ${process.env.GROQ_API_KEY}`
      },
      body: JSON.stringify(req.body)
    });

    // Stream forward
    res.setHeader('Content-Type', 'text/event-stream');
    res.setHeader('Cache-Control', 'no-cache');
    const reader = r.body.getReader();
    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      res.write(value);
    }
    res.end();
  }
