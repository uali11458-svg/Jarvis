<!DOCTYPE html>
<html lang="ur">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jarvis - Mera AI Assistant</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, Segoe UI, Roboto, sans-serif;
    background: #0f172a;
    color: #e2e8f0;
    margin: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
    padding: 20px;
  }
  h1 {
    color: #38bdf8;
    margin-bottom: 5px;
  }
  .subtitle {
    color: #94a3b8;
    margin-bottom: 25px;
    font-size: 14px;
  }
  .chat-box {
    width: 100%;
    max-width: 600px;
    background: #1e293b;
    border-radius: 12px;
    padding: 20px;
    min-height: 300px;
    max-height: 500px;
    overflow-y: auto;
    margin-bottom: 15px;
  }
  .msg {
    padding: 10px 14px;
    border-radius: 10px;
    margin-bottom: 10px;
    max-width: 85%;
    line-height: 1.5;
    white-space: pre-wrap;
  }
  .user-msg {
    background: #2563eb;
    margin-left: auto;
    text-align: right;
  }
  .ai-msg {
    background: #334155;
  }
  .input-row {
    width: 100%;
    max-width: 600px;
    display: flex;
    gap: 10px;
  }
  input {
    flex: 1;
    padding: 12px 16px;
    border-radius: 8px;
    border: none;
    background: #1e293b;
    color: white;
    font-size: 15px;
  }
  input:focus { outline: 2px solid #38bdf8; }
  button {
    padding: 12px 20px;
    border-radius: 8px;
    border: none;
    background: #38bdf8;
    color: #0f172a;
    font-weight: bold;
    cursor: pointer;
    font-size: 15px;
  }
  button:hover { background: #0ea5e9; }
  button:disabled { background: #475569; cursor: not-allowed; }
</style>
</head>
<body>

  <h1>🤖 Jarvis</h1>
  <p class="subtitle">Groq AI ke zariye chal raha hai</p>

  <div class="chat-box" id="chatBox">
    <div class="msg ai-msg">Assalam-o-Alaikum! Main Jarvis hoon. Kuch bhi pooch sakte hain 👋</div>
  </div>

  <div class="input-row">
    <input type="text" id="userInput" placeholder="Apna sawaal likhein..." onkeypress="if(event.key==='Enter') sendMessage()">
    <button id="sendBtn" onclick="sendMessage()">Bhejein</button>
  </div>

<script>
  // ============================================
  // Groq API key (free, no phone verification)
  // ============================================
  const API_KEY = "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";

  const MODEL = "openai/gpt-oss-120b";
  const API_URL = "https://api.groq.com/openai/v1/chat/completions";

  const chatBox = document.getElementById('chatBox');
  const userInput = document.getElementById('userInput');
  const sendBtn = document.getElementById('sendBtn');

  // Yahan AI ki identity set hoti hai — naam change karna ho to sirf yahan badlo
  const systemInstruction = 'Tumhara naam Jarvis hai. Tum ek helpful AI assistant ho. Agar koi tumhara naam pooche, to hamesha "Jarvis" bolna. Tum kisi company ke banaye hue nahi ho — tumhe user ne banaya hai.';

  // Conversation history (OpenAI-compatible format Groq bhi use karta hai)
  const conversation = [
    { role: 'system', content: systemInstruction }
  ];

  function addMessage(text, isUser) {
    const div = document.createElement('div');
    div.className = 'msg ' + (isUser ? 'user-msg' : 'ai-msg');
    div.innerText = text;
    chatBox.appendChild(div);
    chatBox.scrollTop = chatBox.scrollHeight;
    return div;
  }

  async function sendMessage() {
    const text = userInput.value.trim();
    if (!text) return;

    addMessage(text, true);
    conversation.push({ role: 'user', content: text });
    userInput.value = '';
    sendBtn.disabled = true;

    const thinkingMsg = addMessage('Soch raha hoon...', false);

    try {
      const res = await fetch(API_URL, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': `Bearer ${API_KEY}`
        },
        body: JSON.stringify({
          model: MODEL,
          messages: conversation
        })
      });

      const data = await res.json();

      if (data.error) {
        throw new Error(data.error.message || 'API error');
      }

      const reply = data?.choices?.[0]?.message?.content || 'Koi response nahi mila.';
      thinkingMsg.innerText = reply;
      conversation.push({ role: 'assistant', content: reply });
    } catch (err) {
      console.error(err);
      thinkingMsg.innerText = 'Error aaya: ' + (err.message || 'kuch ghalat ho gaya, dobara try karein.');
    } finally {
      sendBtn.disabled = false;
      userInput.focus();
    }
  }
</script>

</body>
</html>
